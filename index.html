<body>
    <!DOCTYPE html>
    <html lang="ar">

    <head>
        <meta charset="UTF-8">
        <title>حاسبة الخصم</title>

        <style>
            body {
                font-family: Arial;
                text-align: center;
                background: #f5f0ff;
                padding-top: 100px;
            }

            .box {
                background: white;
                width: 300px;
                margin: auto;
                padding: 25px;
                border-radius: 15px;
            }

            input {
                padding: 10px;
                width: 80%;
            }

            button {
                margin-top: 15px;
                padding: 10px 20px;
                background: #6c4ab6;
                color: white;
                border: none;
                border-radius: 8px;
            }
        </style>




        <div class="box">

            <h2>حاسبة الخصم 🛍️</h2>

            <input type="number" id="price" placeholder="سعر المشتريات">

            <br>

            <button onclick="discount()">احسب الخصم</button>

            <p id="result"></p>

        </div>


        <script src="script.js"></script>
</body>
